name: AnarchyCore
version: 2.2.0
main: id.anarchy.core.AnarchyCore
api-version: "26.3"
description: Anarchy survival core with economy, bounty, RTP, vault, combat protection, supply-demand and server-side security
commands:
  stats:
    description: Player statistics
    usage: /stats [player]
  top:
    description: Kill leaderboard
    usage: /top
  discord:
    description: Discord link
    usage: /discord
  balance:
    description: View balance
    usage: /balance
    aliases: [bal, money]
  pay:
    description: Pay another player
    usage: /pay <player> <amount>
  baltop:
    description: Balance leaderboard
    usage: /baltop
  sell:
    description: Sell items
    usage: /sell [hand|all|price|list]
  market:
    description: Supply and demand market information
    usage: /market
  bounty:
    description: Bounty system
    usage: /bounty [player|top|add <player> <amount>]
  rtp:
    description: Random teleport
    usage: /rtp
  vault:
    description: Private item vault
    usage: /vault
  eco:
    description: Admin economy control
    usage: /eco <give|take|set> <player> <amount>
    permission: anarchycore.admin
  anarchycore:
    description: AnarchyCore admin command
    usage: /anarchycore reload
    aliases: [acore]
    permission: anarchycore.admin
permissions:
  anarchycore.combat.bypass:
    description: Bypass combat restrictions
    default: false
  anarchycore.admin:
    description: AnarchyCore admin access
    default: op
