# ================= AnarchyCore =================
# Default dibuat se-vanilla mungkin. Ubah lalu jalankan /anarchycore reload

hide-join-quit: false

commands:
  stats: true
  top: true
  discord: true
  balance: true
  pay: true
  baltop: true
  sell: true
  bounty: true
  eco: true
  anarchycore: true

stats-refresh-minutes: 5
discord-link: "https://discord.gg/contoh"
currency-symbol: "$"

discord:
  enabled: false
  webhook-url: ""
  bot-token: ""
  channel-id: ""
  poll-seconds: 3
  server-name: "Server Anarki"
  avatar-url: "https://mc-heads.net/avatar/{uuid}/128"
  to-game-format: "[Discord] {name}: {message}"
  events:
    chat: true
    join-quit: true
    death: true
    advancement: false
    server-status: true

combat:
  enabled: true
  seconds: 20
  punish-logout: true
  disable-elytra: true
  blocked-commands: [spawn, home, tpa, tpaccept, tpahere, warp, rtp, back, kit]

bounty:
  enabled: true
  per-kill: 500
  claim-percent: 0.5
  max: 1000000
  same-victim-cooldown-minutes: 10
  min-add: 100

lag-guard:
  item-clean-minutes: 0
  item-min-age-minutes: 10
  announce: true

tiers:
  COMMON:
    price: 30
    depth: 256
    items: [ENDER_PEARL, BLAZE_ROD, GHAST_TEAR, PHANTOM_MEMBRANE, EXPERIENCE_BOTTLE, NAUTILUS_SHELL]
  UNCOMMON:
    price: 200
    depth: 96
    items: [SHULKER_SHELL, GOLDEN_APPLE, ENCHANTED_BOOK, NETHERITE_SCRAP, WITHER_SKELETON_SKULL]
  RARE:
    price: 800
    depth: 32
    items: [TOTEM_OF_UNDYING, TRIDENT, HEART_OF_THE_SEA, NETHERITE_INGOT]
  EPIC:
    price: 4000
    depth: 12
    items: [ELYTRA, ENCHANTED_GOLDEN_APPLE, NETHER_STAR, DRAGON_EGG, BEACON, DRAGON_HEAD]

overrides:
  NETHERITE_INGOT: 1200
  ENCHANTED_GOLDEN_APPLE: 2400
  DRAGON_HEAD: 3000
  BEACON: 4800
  DRAGON_EGG: 10000

market:
  auto-price:
    enabled: true
    depth: 64
  half-life-hours: 6
  min-multiplier: 0.2
  trend-amplitude: 0.12
  trend-period-hours: 24
  enchant-bonus-per-level: 0.08
  enchant-bonus-cap: 1.5
  min-durability-factor: 0.05
  default-depth: 32
